# Database Configuration
# For local dev: set these in your OS environment OR keep localhost defaults below
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codeb_ims?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
# Render sets the PORT env variable automatically
server.port=${PORT:8080}

# JWT Secret (override in production via environment variable)
app.jwt.secret=${JWT_SECRET:codeb-ims-super-secret-jwt-key-change-in-production-2024}
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.codeb.ims=INFO

