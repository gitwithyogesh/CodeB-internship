services:
  # ─────────────────────────────────────────
  # SERVICE 1: Spring Boot Backend (Java)
  # ─────────────────────────────────────────
  - type: web
    name: codeb-ims-backend
    runtime: java
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/ims-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false   # You will fill this manually in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure secret
      - key: JAVA_VERSION
        value: 17

  # ─────────────────────────────────────────
  # SERVICE 2: React Frontend (Static Site)
  # ─────────────────────────────────────────
  - type: web
    name: codeb-ims-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Proxy all /api/* calls to the backend service (no CORS issues!)
      - type: rewrite
        source: /api/*
        destination: https://codeb-ims-backend.onrender.com/api/*
      # React Router: fallback all routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
